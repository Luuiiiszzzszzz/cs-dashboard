<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Pós-Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080b10;color:#d8e8ff;font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#0f1420;border:1px solid #1e2d45;border-radius:20px;padding:40px;width:420px;max-width:95vw}
.logo{width:52px;height:52px;background:linear-gradient(135deg,#00c6ff,#0077ff);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}
h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{font-size:12px;color:#4a6080;text-align:center;margin-bottom:24px}
.tabs{display:flex;gap:4px;background:#080b10;border:1px solid #1e2d45;border-radius:10px;padding:3px;margin-bottom:22px}
.tab{flex:1;padding:9px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:all .15s}
.tab.on{background:#0f1420;color:#d8e8ff;box-shadow:0 0 0 1px #1e2d45}
.tab.off{background:transparent;color:#4a6080}
.field{margin-bottom:14px}
label{display:block;font-size:10px;font-weight:700;color:#4a6080;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px}
.pw{position:relative}
input[type=text],input[type=password]{width:100%;background:#080b10;border:1px solid #1e2d45;border-radius:9px;padding:11px 14px;color:#d8e8ff;font-family:'Outfit',sans-serif;font-size:13px;outline:none}
input[type=text]:focus,input[type=password]:focus{border-color:#00c6ff}
input.pe{padding-right:44px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;padding:0;line-height:1}
.btn{width:100%;padding:12px;border-radius:10px;background:linear-gradient(135deg,#00c6ff,#0077ff);color:#000;font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;border:none;cursor:pointer;margin-top:6px}
.btn:hover{opacity:.9}
.msg{border-radius:8px;padding:10px 14px;font-size:12px;font-weight:600;margin-top:12px;text-align:center;display:none}
.err{background:#f7545415;border:1px solid #f7545440;color:#f75454;display:block}
.ok{background:#22d18715;border:1px solid #22d18740;color:#22d187;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📦</div>
  <h1>CS Pós-Vendas</h1>
  <div class="sub">Acesse o painel da equipe</div>
  <div class="tabs">
    <button class="tab on" id="t1" onclick="sw('in')">Entrar</button>
    <button class="tab off" id="t2" onclick="sw('rg')">Solicitar Acesso</button>
  </div>

  <div id="pin">
    <div class="field"><label>Usuário</label><input type="text" id="iu" placeholder="Seu usuário" autocomplete="username"></div>
    <div class="field"><label>Senha</label>
      <div class="pw">
        <input type="password" id="ip" class="pe" placeholder="Sua senha" autocomplete="current-password">
        <button class="eye" type="button" id="eye1">👁️</button>
      </div>
    </div>
    <button class="btn" id="btn-in">Entrar</button>
    <div class="msg" id="mi"></div>
  </div>

  <div id="prg" style="display:none">
    <div class="field"><label>Usuário desejado</label><input type="text" id="ru" placeholder="Ex: mel, migue..."></div>
    <div class="field"><label>Senha</label>
      <div class="pw">
        <input type="password" id="rp" class="pe" placeholder="Crie uma senha">
        <button class="eye" type="button" id="eye2">👁️</button>
      </div>
    </div>
    <div class="field"><label>Confirmar Senha</label><input type="password" id="rp2" placeholder="Repita a senha"></div>
    <button class="btn" id="btn-rg">Solicitar Acesso</button>
    <div class="msg" id="mr"></div>
  </div>
</div>

<script>
// Toggle tabs
function sw(t){
  document.getElementById('t1').className='tab '+(t==='in'?'on':'off');
  document.getElementById('t2').className='tab '+(t==='rg'?'on':'off');
  document.getElementById('pin').style.display=t==='in'?'block':'none';
  document.getElementById('prg').style.display=t==='rg'?'block':'none';
}

// Eye toggle
document.getElementById('eye1').onclick=function(){
  var el=document.getElementById('ip');
  el.type=el.type==='password'?'text':'password';
  this.textContent=el.type==='password'?'👁️':'🙈';
};
document.getElementById('eye2').onclick=function(){
  var el=document.getElementById('rp');
  el.type=el.type==='password'?'text':'password';
  this.textContent=el.type==='password'?'👁️':'🙈';
};

// Users stored in localStorage
var UK='_cs_u';
function gu(){try{return JSON.parse(localStorage.getItem(UK)||'[]');}catch(e){return [];}}
function su(u){localStorage.setItem(UK,JSON.stringify(u));}

// Default admin
if(!gu().length){su([{id:1,usuario:'admin',senha:'admin123',role:'Administrador'}]);}

// Show message
function msg(id,txt,cls){
  var e=document.getElementById(id);
  e.className='msg '+cls;
  e.textContent=txt;
}

// Login
document.getElementById('btn-in').onclick=function(){
  var u=document.getElementById('iu').value.trim().toLowerCase();
  var p=document.getElementById('ip').value;
  if(!u||!p){msg('mi','Preencha usuário e senha.','err');return;}
  var found=gu().find(function(x){return x.usuario===u&&x.senha===p&&!x.pendente;});
  if(!found){msg('mi','Usuário ou senha incorretos.','err');return;}
  sessionStorage.setItem('_cs_s',JSON.stringify(found));
  goToDash(found);
};

// Register
document.getElementById('btn-rg').onclick=function(){
  var u=document.getElementById('ru').value.trim().toLowerCase();
  var p=document.getElementById('rp').value;
  var p2=document.getElementById('rp2').value;
  if(!u||!p){msg('mr','Preencha todos os campos.','err');return;}
  if(p!==p2){msg('mr','As senhas não coincidem.','err');return;}
  if(p.length<4){msg('mr','Senha muito curta (mín. 4).','err');return;}
  var us=gu();
  if(us.find(function(x){return x.usuario===u;})){msg('mr','Usuário já existe.','err');return;}
  us.push({id:Date.now(),usuario:u,senha:p,role:'Equipe CS',pendente:true});
  su(us);
  msg('mr','✅ Solicitação enviada! O admin vai liberar seu acesso.','ok');
  document.getElementById('ru').value='';
  document.getElementById('rp').value='';
  document.getElementById('rp2').value='';
};

// Enter key
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(document.getElementById('prg').style.display!=='none'){
    document.getElementById('btn-rg').click();
  } else {
    document.getElementById('btn-in').click();
  }
});

function goToDash(usr){
  // Store user and go to dashboard page
  window.location.href='dashboard.html?u='+encodeURIComponent(usr.usuario);
}

// Check if already logged in
var s=sessionStorage.getItem('_cs_s');
if(s){try{var u=JSON.parse(s);if(u&&!u.pendente){window.location.href='dashboard.html?u='+encodeURIComponent(u.usuario);}}catch(e){}}
</script>
</body>
</html>
